
name: Gerar APK - Conferencia de Inventario

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'saida/**'

permissions:
  contents: write

jobs:
  gerar-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.9.0'

      - name: Preparar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Localizar e configurar Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager nao encontrado."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi

          echo "sdkmanager encontrado em: $SDKMANAGER"
          "$SDKMANAGER" --version

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER"             "platform-tools"             "platforms;android-36"             "build-tools;36.0.0"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Instalar Cordova
        run: npm install -g cordova@13.0.0

      - name: Instalar dependencias e plugins
        run: npm install

      - name: Recriar Android e plugins
        shell: bash
        run: |
          rm -rf platforms plugins
          cordova platform add android@15.0.0
          cordova prepare android

      - name: Verificar requisitos Cordova
        run: cordova requirements android

      - name: Gerar APK
        run: cordova build android --debug

      - name: Preparar APK
        shell: bash
        run: |
          mkdir -p saida

          APK_ORIGEM="platforms/android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_ORIGEM" ]; then
            echo "ERRO: APK nao encontrado no caminho esperado."
            find platforms/android -type f -name "*.apk" -print || true
            exit 1
          fi

          cp "$APK_ORIGEM" saida/Conferencia_de_Inventario.apk
          ls -lh saida/Conferencia_de_Inventario.apk

      - name: Salvar APK na pasta saida da main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f saida/Conferencia_de_Inventario.apk
          git diff --cached --quiet || git commit -m "Atualizar APK da Conferencia de Inventario"
          git push

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: Conferencia-de-Inventario-APK
          path: saida/Conferencia_de_Inventario.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Publicar estrutura Cordova gerada
        uses: actions/upload-artifact@v4
        with:
          name: Estrutura-Cordova-Gerada
          path: |
            plugins/
            platforms/android/
            saida/Conferencia_de_Inventario.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
